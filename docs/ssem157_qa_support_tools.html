<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SSEM157 QA Support Tools</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --surface: #ffffff;
      --line: #dce3ec;
      --text: #172033;
      --muted: #657186;
      --accent: #2563eb;
      --accent-soft: #eaf1ff;
      --shadow: 0 8px 28px rgba(15, 23, 42, .08);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
    }

    body {
      overflow: hidden;
    }

    .app {
      height: 100vh;
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 22px 14px;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
    }

    .brand {
      min-width: 0;
    }

    .brand h1 {
      margin: 0;
      font-size: clamp(22px, 3vw, 30px);
      line-height: 1.2;
      letter-spacing: -.02em;
    }

    .brand p {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .brand-badge {
      flex: 0 0 auto;
      padding: 7px 10px;
      border-radius: 999px;
      background: #111827;
      color: #ffffff;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .08em;
    }

    .tabs-wrap {
      padding: 12px 18px;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
      overflow-x: auto;
      scrollbar-width: thin;
    }

    .tabs {
      display: flex;
      gap: 8px;
      min-width: max-content;
    }

    .tab-button {
      appearance: none;
      border: 1px solid var(--line);
      background: #ffffff;
      color: #526078;
      min-height: 42px;
      padding: 9px 14px;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 750;
      cursor: pointer;
      transition: .16s ease;
    }

    .tab-button:hover {
      border-color: #b9c7da;
      background: #f8fafc;
    }

    .tab-button.active {
      border-color: #9db9ff;
      background: var(--accent-soft);
      color: #1746a2;
      box-shadow: inset 0 0 0 1px rgba(37, 99, 235, .06);
    }

    .tab-icon {
      display: inline-flex;
      width: 22px;
      height: 22px;
      align-items: center;
      justify-content: center;
      border-radius: 7px;
      background: #f0f3f8;
      font-size: 12px;
    }

    .tab-button.active .tab-icon {
      background: #dbe8ff;
    }

    .workspace {
      min-height: 0;
      position: relative;
      padding: 14px;
    }

    .tool-panel {
      display: none;
      width: 100%;
      height: 100%;
      border: 1px solid var(--line);
      border-radius: 16px;
      overflow: hidden;
      background: #ffffff;
      box-shadow: var(--shadow);
    }

    .tool-panel.active {
      display: block;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #ffffff;
    }

    @media (max-width: 640px) {
      .topbar {
        padding: 14px 14px 11px;
      }

      .brand p {
        display: none;
      }

      .brand-badge {
        font-size: 10px;
      }

      .tabs-wrap {
        padding: 9px 10px;
      }

      .tab-button {
        padding: 8px 11px;
        min-height: 40px;
        font-size: 13px;
      }

      .workspace {
        padding: 8px;
      }

      .tool-panel {
        border-radius: 12px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <h1>SSEM157 QA Support Tools</h1>
        <p>쌤157 QA 테스트 및 운영 지원 도구</p>
      </div>
      <div class="brand-badge">QA TOOLKIT</div>
    </header>

    <nav class="tabs-wrap" aria-label="QA 도구 메뉴">
      <div class="tabs">
        <button class="tab-button active" data-tab="scheme" type="button">
          <span class="tab-icon">↗</span>
          <span>Scheme 테스트</span>
        </button>
<button class="tab-button" data-tab="cert-scheme" type="button">
          <span class="tab-icon">🔐</span>
          <span>인증서 Scheme</span>
        </button>
<button class="tab-button" data-tab="cert-qr" type="button">
          <span class="tab-icon">▦</span>
          <span>인증서 QR</span>
        </button>
<button class="tab-button" data-tab="push" type="button">
          <span class="tab-icon">✦</span>
          <span>푸시 전송</span>
        </button>
      </div>
    </nav>

    <main class="workspace">
      <section class="tool-panel active" id="panel-scheme">
          <iframe id="frame-scheme" title="Scheme 테스트" loading="eager"></iframe>
        </section>
<section class="tool-panel" id="panel-cert-scheme">
          <iframe id="frame-cert-scheme" title="인증서 Scheme" loading="lazy"></iframe>
        </section>
<section class="tool-panel" id="panel-cert-qr">
          <iframe id="frame-cert-qr" title="인증서 QR" loading="lazy"></iframe>
        </section>
<section class="tool-panel" id="panel-push">
          <iframe id="frame-push" title="푸시 전송" loading="lazy"></iframe>
        </section>
    </main>
  </div>

    const loaded = new Set();

    function decodeBase64Utf8(base64) {
      const bytes = Uint8Array.from(atob(base64), c => c.charCodeAt(0));
      return new TextDecoder("utf-8").decode(bytes);
    }

    function loadTool(id) {
      if (loaded.has(id)) return;
      const frame = document.getElementById("frame-" + id);
      frame.srcdoc = decodeBase64Utf8(toolHtml[id]);
      loaded.add(id);
    }

    function activateTab(id) {
      document.querySelectorAll(".tab-button").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.tab === id);
      });

      document.querySelectorAll(".tool-panel").forEach(panel => {
        panel.classList.toggle("active", panel.id === "panel-" + id);
      });

      loadTool(id);

      try {
        localStorage.setItem("ssem157QaActiveTab", id);
      } catch (e) {}
    }

    document.querySelectorAll(".tab-button").forEach(btn => {
      btn.addEventListener("click", () => activateTab(btn.dataset.tab));
    });

    let initial = "scheme";
    try {
      const saved = localStorage.getItem("ssem157QaActiveTab");
      if (saved && toolHtml[saved]) initial = saved;
    } catch (e) {}

    activateTab(initial);
  </script>
