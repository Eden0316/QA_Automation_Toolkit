<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SSEM157 QA Support Tools</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --surface: #ffffff;
      --line: #dce3ec;
      --text: #172033;
      --muted: #657186;
      --accent: #2563eb;
      --accent-soft: #eaf1ff;
      --shadow: 0 8px 28px rgba(15, 23, 42, .08);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
    }

    body {
      overflow: hidden;
    }

    .app {
      height: 100vh;
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 22px 14px;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
    }

    .brand {
      min-width: 0;
    }

    .brand h1 {
      margin: 0;
      font-size: clamp(22px, 3vw, 30px);
      line-height: 1.2;
      letter-spacing: -.02em;
    }

    .brand p {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .brand-badge {
      flex: 0 0 auto;
      padding: 7px 10px;
      border-radius: 999px;
      background: #111827;
      color: #ffffff;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .08em;
    }

    .tabs-wrap {
      padding: 12px 18px;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
      overflow-x: auto;
      scrollbar-width: thin;
    }

    .tabs {
      display: flex;
      gap: 8px;
      min-width: max-content;
    }

    .tab-button {
      appearance: none;
      border: 1px solid var(--line);
      background: #ffffff;
      color: #526078;
      min-height: 42px;
      padding: 9px 14px;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 750;
      cursor: pointer;
      transition: .16s ease;
    }

    .tab-button:hover {
      border-color: #b9c7da;
      background: #f8fafc;
    }

    .tab-button.active {
      border-color: #9db9ff;
      background: var(--accent-soft);
      color: #1746a2;
      box-shadow: inset 0 0 0 1px rgba(37, 99, 235, .06);
    }

    .tab-icon {
      display: inline-flex;
      width: 22px;
      height: 22px;
      align-items: center;
      justify-content: center;
      border-radius: 7px;
      background: #f0f3f8;
      font-size: 12px;
    }

    .tab-button.active .tab-icon {
      background: #dbe8ff;
    }

    .workspace {
      min-height: 0;
      position: relative;
      padding: 14px;
    }

    .tool-panel {
      display: none;
      width: 100%;
      height: 100%;
      border: 1px solid var(--line);
      border-radius: 16px;
      overflow: hidden;
      background: #ffffff;
      box-shadow: var(--shadow);
    }

    .tool-panel.active {
      display: block;
    }

    /* 푸시 전송 탭과 같은 화면 폭·여백·카드·입력·버튼 스타일을 사용한다. */
    #panel-history-delete { overflow: auto; background: #f6f7f9; color: #1f2937; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif; }
    .history-content { max-width: 900px; margin: auto; padding: 40px 16px 64px; }
    .history-content h2 { margin: 0 0 10px; font-size: 34px; }
    .history-desc { margin: 0 0 24px; color: #667085; line-height: 1.7; }
    .history-card { background: #fff; border: 1px solid #d9dee7; border-radius: 16px; padding: 20px; box-shadow: 0 5px 18px rgba(15,23,42,.05); }
    .history-content label { display: block; margin: 0 0 7px; font-weight: 700; }
    .history-content select, .history-content input { width: 100%; min-height: 46px; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 10px; background: #fff; font-size: 15px; color: inherit; }
    .history-summary { margin-top: 16px; padding: 10px 12px; border: 1px solid #e2e8f0; border-radius: 10px; background: #f8fafc; font-size: 13px; line-height: 1.5; }
    .history-summary strong { display: block; color: #475569; margin-bottom: 2px; }
    .history-content .history-preview-label { margin: 22px 0 8px; }
    .history-content textarea { display: block; width: 100%; min-height: 140px; margin: 0; padding: 16px; border: 0; border-radius: 12px; background: #0f172a; color: #e2e8f0; font-family: Consolas, monospace; font-size: 13px; line-height: 1.65; overflow-wrap: anywhere; resize: vertical; }
    .history-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
    .history-actions a, .history-actions button { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 10px 18px; border-radius: 10px; border: 1px solid #cbd5e1; font-size: 15px; font-weight: 700; cursor: pointer; text-decoration: none; }
    .history-actions a { border-color: #111827; background: #111827; color: #fff; }
    .history-actions button { background: #fff; color: #334155; }
    #history-status { margin: 12px 0 0; color: #667085; font-size: 13px; line-height: 1.5; }
    #history-status:empty { display: none; }
    @media (max-width: 650px) {
      .history-actions { display: grid; }
      .history-actions a, .history-actions button { width: 100%; }
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #ffffff;
    }

    @media (max-width: 640px) {
      .topbar {
        padding: 14px 14px 11px;
      }

      .brand p {
        display: none;
      }

      .brand-badge {
        font-size: 10px;
      }

      .tabs-wrap {
        padding: 9px 10px;
      }

      .tab-button {
        padding: 8px 11px;
        min-height: 40px;
        font-size: 13px;
      }

      .workspace {
        padding: 8px;
      }

      .tool-panel {
        border-radius: 12px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <h1>SSEM157 QA Support Tools</h1>
        <p>쌤157 QA 테스트 및 운영 지원 도구</p>
      </div>
      <div class="brand-badge">QA TOOLKIT</div>
    </header>

    <nav class="tabs-wrap" aria-label="QA 도구 메뉴">
      <div class="tabs">
        <button class="tab-button active" data-tab="scheme" type="button">
          <span class="tab-icon">↗</span>
          <span>Scheme 테스트</span>
        </button>
<button class="tab-button" data-tab="cert-scheme" type="button">
          <span class="tab-icon">🔐</span>
          <span>인증서 Scheme</span>
        </button>
<button class="tab-button" data-tab="cert-qr" type="button">
          <span class="tab-icon">▦</span>
          <span>인증서 QR</span>
        </button>
<button class="tab-button" data-tab="push" type="button">
          <span class="tab-icon">✦</span>
          <span>푸시 전송</span>
        </button>
        <button class="tab-button" data-tab="history-delete" type="button">
          <span class="tab-icon">⌫</span>
          <span>자료수집 이력삭제</span>
        </button>
      </div>
    </nav>

    <main class="workspace">
      <section class="tool-panel active" id="panel-scheme">
          <iframe id="frame-scheme" title="Scheme 테스트" loading="eager"></iframe>
        </section>
<section class="tool-panel" id="panel-cert-scheme">
          <iframe id="frame-cert-scheme" title="인증서 Scheme" loading="lazy"></iframe>
        </section>
<section class="tool-panel" id="panel-cert-qr">
          <iframe id="frame-cert-qr" title="인증서 QR" loading="lazy"></iframe>
        </section>
<section class="tool-panel" id="panel-push">
          <iframe id="frame-push" title="푸시 전송" loading="lazy"></iframe>
        </section>
      <section class="tool-panel" id="panel-history-delete">
        <div class="history-content">
          <h2>쌤157 자료수집 이력삭제</h2>
          <p class="history-desc">HT_TIN을 선택하면 자료수집 이력삭제 URL이 생성됩니다. 개발 환경에서 새 탭으로 실행하거나 URL을 복사할 수 있습니다.</p>
          <div class="history-card">
          <label for="history-customer">HT_TIN 선택</label>
          <select id="history-customer"></select>
          <label for="history-custom" style="margin-top:10px">HT_TIN 직접 입력</label>
          <input id="history-custom" type="text" inputmode="numeric" placeholder="목록에 없는 HT_TIN 입력 (입력 시 우선 적용)">
          <div class="history-summary"><strong>선택된 HT_TIN</strong><span id="history-selection"></span></div>
          <label class="history-preview-label" for="history-url">생성된 URL</label>
          <textarea id="history-url" readonly spellcheck="false"></textarea>
          <div class="history-actions">
            <a id="history-run" target="_blank" rel="noopener noreferrer">새 탭에서 실행</a>
            <button id="history-copy" type="button">URL 복사</button>
          </div>
          <p id="history-status" role="status" aria-live="polite"></p>
          </div>
        </div>
      </section>
    </main>
  </div>

    const loaded = new Set();

    function setupCertBookmarklet(frame) {
      const doc = frame.contentDocument;
      const box = doc.createElement('section');
      box.style.cssText = 'padding:20px;border:1px solid #d9dee7;border-radius:16px;background:#fff;box-shadow:0 5px 18px rgba(15,23,42,.05);margin-bottom:24px';
      box.innerHTML = `<h2>인증서 북마클릿</h2>
        <p class="desc" style="margin-top:12px">아래 버튼을 브라우저 북마크바로 드래그해 저장하세요. 사용할 환경을 연 뒤 저장한 북마크를 누르면 됩니다.</p>
        <div class="actions">
          <a id="cert-bookmark-save" class="launch-button" draggable="true">쌤157 인증서 북마클릿</a>
          <button id="cert-bookmark-copy" class="copy-button" type="button">코드 복사</button>
        </div>
        <p id="cert-bookmark-status" role="status" aria-live="polite" class="desc" style="margin-top:12px"></p>
        <div class="actions">
          <a class="copy-button" style="text-decoration:none" href="https://wvr.d.nux.kr/html/m001.html" target="_blank" rel="noopener noreferrer">쌤157 개발 ↗</a>
          <a class="copy-button" style="text-decoration:none" href="https://wvr.s.nux.kr/html/m001.html" target="_blank" rel="noopener noreferrer">쌤157 스테이징 ↗</a>
          <a class="copy-button" style="text-decoration:none" href="https://sve.ssem.kr/html/m001.html" target="_blank" rel="noopener noreferrer">쌤157 운영 ↗</a>
        </div>`;
      doc.querySelector('header').after(box);
      const link = doc.getElementById('cert-bookmark-save');
      const status = doc.getElementById('cert-bookmark-status');
      link.setAttribute('href', certBookmarklet);
      link.addEventListener('click', event => {
        event.preventDefault();
        status.textContent = '이 버튼을 북마크바로 드래그하세요. 북마크바는 Ctrl+Shift+B로 표시할 수 있습니다.';
      });
      doc.getElementById('cert-bookmark-copy').addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(certBookmarklet);
          status.textContent = '북마클릿 코드를 복사했습니다. 북마크의 URL 칸에 붙여넣으세요.';
        } catch (error) {
          const input = doc.createElement('textarea');
          input.value = certBookmarklet;
          box.appendChild(input);
          input.focus(); input.select();
          let copied = false;
          try { copied = doc.execCommand('copy'); } catch (ignored) {}
          if (copied) input.remove();
          status.textContent = copied ? '북마클릿 코드를 복사했습니다.' : '자동 복사가 차단됐습니다. 선택된 코드를 Ctrl+C로 복사하세요.';
        }
      });
    }

    function decodeBase64Utf8(base64) {
      const bytes = Uint8Array.from(atob(base64), c => c.charCodeAt(0));
      return new TextDecoder("utf-8").decode(bytes);
    }

    function loadTool(id) {
      if (loaded.has(id)) return;
      if (id === "history-delete") {
        // 푸시 전송의 목록을 그대로 재사용해 두 탭의 고객 정보가 어긋나지 않게 한다.
        const pushDoc = new DOMParser().parseFromString(decodeBase64Utf8(toolHtml.push), "text/html");
        const select = document.getElementById("history-customer");
        const custom = document.getElementById("history-custom");
        const source = pushDoc.getElementById("htTinSelect");
        for (const option of source.options) select.appendChild(option.cloneNode(true));
        const preview = document.getElementById("history-url");
        const status = document.getElementById("history-status");
        function updateHistoryUrl() {
          const customValue = custom.value.trim();
          const htTin = customValue || select.value;
          const url = "https://sadm.d.nux.kr/sadm/com/sve/admin/scr/dev_scr_hist_delete.nut?nut="
            + encodeURIComponent(JSON.stringify({ HT_TIN: htTin }));
          document.getElementById("history-selection").textContent = customValue
            ? "직접 입력 — " + customValue : select.selectedOptions[0].textContent;
          preview.value = url;
          document.getElementById("history-run").href = url;
          status.textContent = "";
        }
        select.addEventListener("change", updateHistoryUrl);
        custom.addEventListener("input", updateHistoryUrl);
        document.getElementById("history-copy").addEventListener("click", async () => {
          try {
            await navigator.clipboard.writeText(preview.value);
            status.textContent = "URL을 복사했다.";
          } catch (e) {
            preview.focus();
            preview.select();
            let copied = false;
            try { copied = document.execCommand("copy"); } catch (ignored) {}
            status.textContent = copied ? "URL을 복사했다." : "자동 복사가 차단됐다. 선택된 URL을 Ctrl+C로 복사한다.";
          }
        });
        updateHistoryUrl();
        loaded.add(id);
        return;
      }
      const frame = document.getElementById("frame-" + id);
      if (id === 'cert-scheme') frame.addEventListener('load', () => setupCertBookmarklet(frame), { once: true });
      frame.srcdoc = decodeBase64Utf8(toolHtml[id]);
      loaded.add(id);
    }

    function activateTab(id) {
      document.querySelectorAll(".tab-button").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.tab === id);
      });

      document.querySelectorAll(".tool-panel").forEach(panel => {
        panel.classList.toggle("active", panel.id === "panel-" + id);
      });

      loadTool(id);

      try {
        localStorage.setItem("ssem157QaActiveTab", id);
      } catch (e) {}
    }

    document.querySelectorAll(".tab-button").forEach(btn => {
      btn.addEventListener("click", () => activateTab(btn.dataset.tab));
    });

    let initial = "scheme";
    try {
      const saved = localStorage.getItem("ssem157QaActiveTab");
      if (saved && (toolHtml[saved] || saved === "history-delete")) initial = saved;
    } catch (e) {}

    activateTab(initial);
  </script>
